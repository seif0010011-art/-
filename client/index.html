<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HOSAM · شاهد مع أصحابك</title>
    <style>
      :root { --f1: #ff3d00; --f2: #ff9100; --f3: #ffd600; --bg: #070304; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; overflow: hidden; }

      /* ===== شاشة الدخول ===== */
      #splash { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: hidden; background: #000; }
      #bg { position: absolute; inset: -6%; background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)), url("/hero.jpg") center/cover no-repeat; animation: kenburns 24s ease-in-out infinite alternate; will-change: transform; }
      #bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 110%, rgba(255,61,0,.75), transparent 60%), linear-gradient(to top, rgba(7,3,4,.95), transparent 55%); }
      @keyframes kenburns { from { transform: scale(1.02) translate(0,0); } to { transform: scale(1.14) translate(-2%, -2%); } }
      #fire { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #content { position: relative; z-index: 2; text-align: center; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: rise 1.2s cubic-bezier(.2,.9,.2,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.9); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

      .logo { position: relative; font-family: "Impact", "Arial Black", system-ui, sans-serif; font-weight: 900; font-size: clamp(48px, 16vw, 110px); letter-spacing: .06em; line-height: 1;
        background: linear-gradient(to top, var(--f1), var(--f2) 55%, var(--f3)); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 18px rgba(255,100,0,.9)) drop-shadow(0 0 48px rgba(255,61,0,.7)); direction: ltr; }
      .logo::before, .logo::after { content: attr(data-text); position: absolute; inset: 0; background: inherit; -webkit-background-clip: text; background-clip: text; color: transparent; }
      .logo::before { transform: translate(3px, 0); animation: glitch1 3.2s infinite steps(1); }
      .logo::after  { transform: translate(-3px, 0); animation: glitch2 2.7s infinite steps(1); }
      @keyframes glitch1 { 0%,92%,100% { clip-path: inset(0 0 0 0); } 93% { clip-path: inset(10% 0 60% 0); transform: translate(8px,0); } 95% { clip-path: inset(55% 0 12% 0); transform: translate(-6px,0); } }
      @keyframes glitch2 { 0%,88%,100% { clip-path: inset(0 0 0 0); } 89% { clip-path: inset(40% 0 30% 0); transform: translate(-9px,0); } 91% { clip-path: inset(5% 0 75% 0); transform: translate(7px,0); } }
      @keyframes flicker { 0%,100% { opacity: 1; } 8% { opacity: .85; } 10% { opacity: 1; } 52% { opacity: .92; } 54% { opacity: 1; } }

      .sub { margin: 0; font-size: clamp(16px, 4.6vw, 22px); font-weight: 800; color: #ffd9b8; text-shadow: 0 0 14px rgba(255,90,0,.8); }
      .sub .typed { border-inline-end: 3px solid var(--f2); padding-inline-end: 4px; animation: caret .8s infinite; }
      @keyframes caret { 50% { border-color: transparent; } }

      #enter { position: relative; margin-top: 10px; border: 0; cursor: pointer; padding: 16px 44px; border-radius: 999px; font: 900 20px system-ui, "Segoe UI", Tahoma, sans-serif; color: #1a0500;
        background: linear-gradient(135deg, var(--f3), var(--f2) 45%, var(--f1)); box-shadow: 0 0 0 0 rgba(255,100,0,.8), 0 0 40px rgba(255,90,0,.8); animation: pulse 1.6s infinite; transition: transform .15s; }
      #enter:active { transform: scale(.94); }
      .loading { display: flex; align-items: center; gap: 10px; min-height: 28px; font-weight: 800; color: #ffd9b8; }
      .loading.done .dots { display: none; }
      .dots i { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: var(--f2); animation: dot 1.2s infinite; }
      .dots i:nth-child(2) { animation-delay: .2s; }
      .dots i:nth-child(3) { animation-delay: .4s; }
      @keyframes dot { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.25); } }
      .ver { font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .15em; color: #9a7a66; direction: ltr; }
      #enter { opacity: 0; transform: translateY(8px); pointer-events: none; }
      #enter.ready { opacity: 1; transform: none; pointer-events: auto; transition: opacity .5s, transform .5s; }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,120,0,.75), 0 0 40px rgba(255,90,0,.8); } 70% { box-shadow: 0 0 0 28px rgba(255,120,0,0), 0 0 60px rgba(255,90,0,1); } 100% { box-shadow: 0 0 0 0 rgba(255,120,0,0), 0 0 40px rgba(255,90,0,.8); } }

      .credit { margin-top: 26px; font-family: "Impact", "Arial Black", system-ui, sans-serif; font-size: 12px; letter-spacing: .25em; color: #ffb27a; opacity: .9; direction: ltr; text-transform: uppercase; }
      .credit b { color: #fff; text-shadow: 0 0 10px var(--f2), 0 0 24px var(--f1); }

      /* ===== حركات الصدمة ===== */
      #flash { position: fixed; inset: 0; z-index: 30; background: #fff; opacity: 0; pointer-events: none; }
      .shake { animation: shake .7s cubic-bezier(.36,.07,.19,.97) both; }
      @keyframes shake { 10%,90% { transform: translate(-3px,1px); } 20%,80% { transform: translate(6px,-3px) rotate(.4deg); } 30%,50%,70% { transform: translate(-12px,4px) rotate(-.8deg); } 40%,60% { transform: translate(12px,-4px) rotate(.8deg); } }
      #splash.boom #content { animation: zoomout .9s ease-in forwards; }
      @keyframes zoomout { to { transform: scale(2.6); opacity: 0; filter: blur(16px) brightness(3); } }
      #splash.gone { animation: burn 1s ease-in forwards; pointer-events: none; }
      @keyframes burn { 0% { opacity: 1; filter: brightness(2.2) hue-rotate(0); } 100% { opacity: 0; filter: brightness(4) hue-rotate(-20deg); transform: scale(1.15); } }

      /* ===== المشغّل ===== */
      #app { position: fixed; inset: 0; display: flex; flex-direction: column; opacity: 0; transform: scale(.96); transition: opacity .8s .3s, transform .8s .3s; }
      #app.show { opacity: 1; transform: none; }
      #bar { display: flex; gap: 8px; padding: 10px; background: linear-gradient(to bottom, #1a0803, #0e0504); border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, var(--f1), var(--f3), var(--f1)) 1; }
      #bar input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid #5a2410; background: #0b0403; color: #fff; font: 600 14px system-ui, "Segoe UI", Tahoma, sans-serif; outline: none; }
      #bar input:focus { border-color: var(--f2); box-shadow: 0 0 14px rgba(255,120,0,.5); }
      #bar button { padding: 0 20px; border: 0; border-radius: 12px; cursor: pointer; background: linear-gradient(135deg, var(--f2), var(--f1)); color: #fff; font: 900 15px system-ui, "Segoe UI", Tahoma, sans-serif; box-shadow: 0 0 16px rgba(255,80,0,.6); }
      video { flex: 1; width: 100%; min-height: 0; background: #000; }
      #ytbox { display: none; flex: 1; min-height: 0; background: #000; }
      #yt { width: 100%; height: 100%; border: 0; }
      #status { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font-size: 12px; color: #ffb27a; background: #0e0504; }
      #status .by { font-family: "Impact", "Arial Black", system-ui, sans-serif; letter-spacing: .15em; font-size: 10px; direction: ltr; }
      #status .by b { color: #fff; }
      .ping { font-family: ui-monospace, Menlo, monospace; font-weight: 800; direction: ltr; padding: 2px 10px; border-radius: 999px; background: #1d0d06; color: #4ade80; border: 1px solid #3a1a0c; transition: color .3s; }
      .ping.mid { color: #facc15; }
      .ping.bad { color: #f87171; }
      #toast { position: fixed; top: 70px; left: 50%; transform: translate(-50%, -20px); z-index: 20; padding: 10px 18px; border-radius: 999px; background: linear-gradient(135deg, var(--f1), #b30000); font-weight: 800; opacity: 0; transition: .35s; pointer-events: none; box-shadow: 0 0 24px rgba(255,60,0,.8); }
      #toast.on { opacity: 1; transform: translate(-50%, 0); }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="bg"></div>
      <canvas id="fire"></canvas>
      <div id="content">
        <div class="logo" data-text="HOSAM">HOSAM</div>
        <p class="sub"><span class="typed" id="typed"></span></p>
        <div class="loading" id="loading"><span class="dots"><i></i><i></i><i></i></span><span id="stage">جاري التهيئة…</span></div>
        <div class="ver" id="ver">V1.0.0 · Booting…</div>
        <button id="enter" disabled>ادخل النار 🔥</button>
        <div class="credit">Developed by <b>Hosam</b></div>
      </div>
    </div>
    <div id="flash"></div>
    <div id="toast"></div>

    <div id="app">
      <div id="bar">
        <input id="url" placeholder="الصق رابط الفيديو (mp4 أو m3u8)" />
        <button id="load">تشغيل 🔥</button>
      </div>
      <video id="video" controls playsinline></video>
      <div id="ytbox"><iframe id="yt" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
      <div id="status"><span id="statusText">جاري الاتصال...</span><span id="ping" class="ping">-- ms</span><span class="by">Developed by <b>Hosam</b></span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
